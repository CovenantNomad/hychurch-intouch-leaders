name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, ESLint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      # Build-only placeholders. Never use production credentials in CI.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9/graphql
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-not-a-real-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-intouch-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-intouch-ci
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-intouch-ci.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGINGSENDER_ID: '1234567890'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:1234567890:web:ci-placeholder'
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-CIPLACEHOLDER
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: ESLint (no warnings)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:ci
      - name: Automated tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
